[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-warmup"
version = "0.3.2"
description = "Estimate useful batch size and learning rate during PyTorch warmup"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Matthew-agi" }]
dependencies = ["torch>=2.2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Matthew-agi/adaptive-warmup"
Repository = "https://github.com/Matthew-agi/adaptive-warmup.git"
Issues = "https://github.com/Matthew-agi/adaptive-warmup/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "numpy>=1.26",
  "pytest>=8.2",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptive_warmup = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
